# 部署 Vite 專案到 GitHub Pages
name: Deploy static content to Pages

on:
  # 當有程式碼推送到 master 分支時觸發
  push:
    branches: ['master']

  # 允許從 Actions 頁籤手動執行此工作流程
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允許一個並行部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout程式碼
        uses: actions/checkout@v4
      
      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: 安裝依賴 (Install dependencies)
        run: npm ci
        
      - name: 建置專案 (Build)
        run: npm run build
        
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: 上傳打包好的靜態檔案 (Upload artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # 上傳 dist 資料夾的內容
          path: './dist'
          
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
